name: CI

on:
  push:
    branches: [main]

# El workflow solo valida el checkout: no publica imágenes, no despliega y no
# necesita credenciales de Google Cloud.
permissions:
  contents: read

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Valores de CI sin privilegios. El build no usa secretos de producción.
      SESSION_SECRET: ci-session-secret-at-least-thirty-two-characters
      FACTURAS_API_URL: https://ci.invalid
      FACTURAS_API_KEY: ci-not-a-secret
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: apps/frontend/pnpm-lock.yaml

      - name: Instalar dependencias
        working-directory: apps/frontend
        run: pnpm install --frozen-lockfile

      - name: Ejecutar tests
        working-directory: apps/frontend
        run: pnpm test

      - name: Ejecutar lint
        working-directory: apps/frontend
        run: pnpm lint

      - name: Comprobar tipos
        working-directory: apps/frontend
        run: pnpm exec tsc --noEmit

      - name: Compilar frontend
        working-directory: apps/frontend
        run: pnpm build

  python:
    name: Python
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.6.14"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Instalar dependencias bloqueadas
        run: uv sync --frozen --all-packages --group dev

      - name: Ejecutar tests unitarios
        env:
          # No hay ADC ni credenciales: los tests deben simular BigQuery.
          BQ_PROJECT_ID: ci-no-project
        run: uv run pytest apps/financialbi/tests apps/facturas-api/tests

  contenedores:
    name: Contenedores
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Construir frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/frontend/Dockerfile.prod
          push: false
          tags: ci/carb-frontend:${{ github.sha }}
          cache-from: type=gha,scope=carb-frontend
          cache-to: type=gha,mode=max,scope=carb-frontend

      - name: Construir FinancialBI
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/financialbi/Dockerfile
          push: false
          tags: ci/carb-financialbi:${{ github.sha }}
          cache-from: type=gha,scope=carb-financialbi
          cache-to: type=gha,mode=max,scope=carb-financialbi

      - name: Construir Facturas API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/facturas-api/Dockerfile
          push: false
          tags: ci/facturas-api:${{ github.sha }}
          cache-from: type=gha,scope=facturas-api
          cache-to: type=gha,mode=max,scope=facturas-api
