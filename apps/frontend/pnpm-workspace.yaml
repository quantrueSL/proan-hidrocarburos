# pnpm 10 no ejecuta los scripts de instalacion (postinstall y similares) por
# defecto: son codigo arbitrario corriendo al instalar una dependencia. Estos
# cuatro se declaran ignorados a proposito, y nada los necesita: vitest, la
# lectura de Firestore y las imagenes funcionan sin ellos. El unico no verificado
# es unrs-resolver, que usa la config de ESLint.
#
# Si algun dia hiciera falta alguno, se mueve a onlyBuiltDependencies.
ignoredBuiltDependencies:
  - "@firebase/util"
  - esbuild
  - protobufjs
  - unrs-resolver
