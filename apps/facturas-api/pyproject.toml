[project]
name = "facturas-api"
version = "0.1.0"
description = "API pública protegida: XML y PDF (representación impresa) de las facturas de gas de Hidrocarburos"
requires-python = ">=3.11"
dependencies = [
    # Mismas versiones que financialbi -- un solo uv.lock para el workspace,
    # así que las dependencias compartidas deben resolver igual en las dos apps.
    "fastapi==0.115.9",
    "uvicorn[standard]==0.34.3",
    "pydantic==2.11.5",
    "google-cloud-bigquery>=3.25.0",
    "google-auth>=2.0",
    # Nuevas, exclusivas de esta app:
    "jinja2>=3.1",
    "weasyprint>=62.0",
    "qrcode[pil]>=7.4",
    "cryptography>=42.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["facturas_api"]
